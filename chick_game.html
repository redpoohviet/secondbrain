<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐥 병아리 게임</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f8ff;
            /* Light blue background */
            text-align: center;
        }

        h1 {
            color: #ff9900;
            /* Orange color for title */
        }

        #game-container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        #chick-display {
            font-size: 80px;
            margin: 20px 0;
            transition: transform 0.3s ease;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
            background-color: #4CAF50;
            /* Green button */
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        ㅆ button:hover {
            background-color: #45a049;
        }

        #score-display {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="game-container">
        <h1>🐣 병아리 키우기 게임</h1>
        <div id="chick-display">🐥</div>
        <p id="message">클릭하여 병아리를 먹이세요!</p>
        <button id="feed-button">먹이 주기 (+1)</button>
        <div id="score-display">점수: 0</div>
    </div>

    <script>
        const chickDisplay = document.getElementById('chick-display');
        const feedButton = document.getElementById('feed-button');
        const scoreDisplay = document.getElementById('score-display');
        const messageDisplay = document.getElementById('message');
        let score = 0;
        let chick = '🐥';

        feedButton.addEventListener('click', () => {
            score += 1;
            chick = '🐣'; // 먹이를 주면 성장 (예시)
            chickDisplay.textContent = chick;
            messageDisplay.textContent = `잘했어요! 현재 점수는 ${score}점입니다!`;
            scoreDisplay.textContent = `점수: ${score}`;
        });

        // 간단한 애니메이션 효과 (선택 사항)
        setTimeout(() => {
            chickDisplay.style.transform = 'scale(1.2)';
            setTimeout(() => {
                chickDisplay.style.transform = 'scale(1.0)';
            }, 300);
        }, 50);

    </script>
</body>

</html>
